<style>
  :root {
    --bg: #F6F1E4;
    --bg-elevated: #FFFDF7;
    --ink: #2A241B;
    --ink-soft: #6E6656;
    --accent: #B23A2E;
    --accent-ink: #FFFDF7;
    --indigo: #2C4356;
    --line: #DFD5BC;
    --line-strong: #C7B99A;
    --radius: 4px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1B1712;
      --bg-elevated: #26211A;
      --ink: #EDE6D6;
      --ink-soft: #A79A7F;
      --accent: #E06A57;
      --accent-ink: #1B1712;
      --indigo: #7FA2BE;
      --line: #3B3428;
      --line-strong: #4C4331;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans JP", -apple-system, BlinkMacSystemFont, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

  h1, h2, .serif { font-family: "Noto Serif JP", serif; font-weight: 700; margin: 0; }
  a { text-decoration: none; color: inherit; }

  .top { text-align: center; margin-bottom: 8px; }
  .top .mark {
    display: inline-block; width: 11px; height: 11px;
    background: var(--accent); transform: rotate(45deg); margin-bottom: 14px;
  }
  .top h1 { font-size: 22px; letter-spacing: 0.02em; }
  .top p { color: var(--ink-soft); font-size: 13px; margin-top: 8px; line-height: 1.7; }

  .cards { margin-top: 32px; display: flex; flex-direction: column; gap: 14px; }

  .card {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
  }
  .card img { width: 64px; height: 64px; border-radius: 12px; flex-shrink: 0; display: block; }
  .card-body { flex: 1; min-width: 0; }
  .card-title { font-family: "Noto Serif JP", serif; font-size: 16px; font-weight: 700; }
  .card-sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 4px; line-height: 1.6; }
  .card-cta {
    flex-shrink: 0;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 13px;
    font-weight: 700;
    padding: 10px 16px;
    border-radius: var(--radius);
    white-space: nowrap;
  }

  .card.placeholder { opacity: 0.55; }
  .card.placeholder .card-cta {
    background: none;
    border: 1px solid var(--line-strong);
    color: var(--ink-soft);
  }
  .card.placeholder .icon-ph {
    width: 64px; height: 64px; border-radius: 12px; flex-shrink: 0;
    background: var(--line);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: var(--bg-elevated);
  }

  footer { margin-top: 44px; text-align: center; font-size: 11.5px; color: var(--ink-soft); line-height: 1.8; }
  footer a { text-decoration: underline; }
